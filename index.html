<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Busy | Amjad Rahman</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --primary: #00ff41;
            --warning: #ffb86c;
            --danger: #ff5555;
            --text: #f8f8f2;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Fira Code', 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .terminal-window {
            width: 95%;
            max-width: 650px;
            height: 400px; /* Fixed height for the terminal */
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: #333;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5555; }
        .yellow { background: #f1fa8c; }
        .green { background: #50fa7b; }

        /* FIXED: Changed alignment to start at the top */
        .content {
            padding: 20px;
            overflow-y: auto; /* Allows scrolling if it gets too long */
            flex-grow: 1;
            display: block; 
        }

        .line { margin: 8px 0; font-size: 14px; line-height: 1.5; opacity: 0; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10deg); } to { opacity: 1; transform: translateX(0); } }

        .cmd { color: var(--primary); font-weight: bold; }
        .msg { color: var(--text); }
        .exit-msg { color: var(--danger); font-style: italic; font-weight: bold; display: block; margin-left: 15px; margin-top: 2px;}
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--primary);
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="top-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="content" id="terminal-content">
            <div class="line"><span class="cmd">></span> Initializing maintenance_mode.sh...</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('terminal-content');
        
        const sequence = [
            { log: "Optimizing database shards...", exit: "Checking your connection... Why are you still here?" },
            { log: "Cleaning up messy JavaScript...", exit: "Don't you have hobbies? Go outside." },
            { log: "Rewriting the entire backend in Brainfuck...", exit: "This page is literally empty. Shoo!" },
            { log: "Compiling coffee into code...", exit: "I'm calling your ISP to tell them you're loitering." },
            { log: "Hiding the bugs under a virtual rug...", exit: "Are you waiting for a post-credits scene? There isn't one." },
            { log: "Replacing Amjad with a highly-trained squirrel...", exit: "STILL HERE? That's it, I'm locking the door." },
            { log: "System offline. Seriously.", exit: "GET OUT. (Error: UserPersistenceException)" }
        ];

        let step = 0;

        function addLine(text, isExit = false) {
            const div = document.createElement('div');
            div.className = 'line';
            if (isExit) {
                div.innerHTML = `<span class="exit-msg">➜ ${text}</span>`;
            } else {
                div.innerHTML = `<span class="cmd">[OK]</span> <span class="msg">${text}</span>`;
            }
            container.appendChild(div);
            
            // Auto-scroll to bottom as new insults appear
            container.scrollTop = container.scrollHeight;
        }

        function runTerminal() {
            if (step < sequence.length) {
                setTimeout(() => {
                    addLine(sequence[step].log);
                    
                    setTimeout(() => {
                        addLine(sequence[step].exit, true);
                        step++;
                        runTerminal();
                    }, 1200);

                }, 2000);
            } else {
                setTimeout(() => {
                    const final = document.createElement('div');
                    final.className = 'line';
                    final.innerHTML = `<hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;"><span class="exit-msg" style="font-size: 18px;">ACCESS DENIED. PLEASE LEAVE.</span><span class="cursor"></span>`;
                    container.appendChild(final);
                    container.scrollTop = container.scrollHeight;
                }, 1500);
            }
        }

        runTerminal();
    </script>
</body>
</html>
